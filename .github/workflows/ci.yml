name: Django CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    name: Lint and Test in Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Создаем тестовый .env для Django и Docker Compose
      - name: Create .env file for CI
        run: |
          echo "SECRET_KEY=django-insecure-ci-secret-key-for-tests" > .env
          echo "DEBUG=True" >> .env
          echo "ALLOWED_HOSTS=127.0.0.1,localhost,0.0.0.0,web" >> .env

      # 2. Собираем образ (цель: development со всеми dev-зависимостями)
      - name: Build Docker containers
        run: docker compose build

      # 3. Быстрая проверка линтером и форматтером (Fail-Fast: падает за секунду при косяках стиля)
      #    --no-cache: не писать .ruff_cache в /app — монтирование тома read-only для others (UID в контейнере != UID хоста)
      - name: Run Ruff
        run: docker compose run --rm web sh -c "ruff check --no-cache . && ruff format --check --no-cache ."

      # 4. Поднимаем базу данных только тогда, когда код проверен на стиль
      - name: Start Database
        run: docker compose up -d db

      # 5. Прогон тестов на живой базе
      #    -p no:cacheprovider: не создавать .pytest_cache в /app — там нет прав на запись из-за монтирования тома
      - name: Run Pytest
        run: docker compose run --rm web pytest -p no:cacheprovider