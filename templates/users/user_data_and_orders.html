{% extends "base.html" %}

{% block title %}Профиль пользователя{% endblock title %}

{% block content %}
<style>
    .profile-container {
        max-width: 900px;
        margin: 20px auto;
        display: flex;
        flex-direction: column;
        gap: 30px;
        color: #e0e0e0;
    }

    .profile-card {
        background-color: #242424;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 25px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .profile-card h3 {
        margin-top: 0;
        margin-bottom: 20px;
        border-bottom: 1px solid #444;
        padding-bottom: 10px;
        color: #fff;
    }

    /* Стилизация формы */
    .profile-form table {
        width: 100%;
        border-collapse: collapse;
    }

    .profile-form td {
        padding: 8px 0;
        vertical-align: middle;
    }

    .profile-form label {
        color: #bbb;
        font-weight: 500;
    }

    .profile-form input[type="text"],
    .profile-form input[type="email"],
    .profile-form input[type="tel"] {
        width: 100%;
        padding: 8px 12px;
        background-color: #1a1a1a;
        border: 1px solid #444;
        border-radius: 4px;
        color: #fff;
        box-sizing: border-box;
    }

    .profile-form input:focus {
        border-color: #ffc107;
        outline: none;
    }

    .btn-submit {
        background-color: #ffc107;
        color: #000;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 15px;
        transition: background-color 0.2s;
    }

    .btn-submit:hover {
        background-color: #e0a800;
    }


    .product-price {
        color: #bbb;
    }
    /* Убираем уродливые маркеры списка и красим ошибку */
    .errorlist {
        list-style: none;
        padding: 0;
        margin: 4px 0 6px 0;
        color: #ff6b6b;
        font-size: 13px;
        font-weight: 500;
    }

    .errorlist li {
        background-color: rgba(255, 82, 82, 0.1);
        border-left: 3px solid #ff5252;
        padding: 6px 10px;
        border-radius: 4px;
    }
</style>

<div class="profile-container">

    <!-- Блок персональных данных -->
    <div class="profile-card">
        <h3>Ваши персональные данные</h3>
        <form method="post" class="profile-form">
            {% csrf_token %}
            {{ form.as_table }}
            <button type="submit" class="btn-submit">Подтвердить изменения</button>
        </form>
    </div>

</div>
{% endblock content %}
