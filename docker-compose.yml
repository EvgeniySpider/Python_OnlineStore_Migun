services:
  db:
    image: postgres:16-alpine
    container_name: online_store_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-store_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5444:5432" # 5444 наружу для подключения через DBeaver/IDE без конфликта с локальным Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-store_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: development
    container_name: online_store_web
    command: sh -c "python manage.py migrate && python manage.py seed_db && python manage.py runserver 0.0.0.0:8000"
    restart: always
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-store_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    env_file:
      - .env

volumes:
  postgres_data: