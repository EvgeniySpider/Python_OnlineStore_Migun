[project]
name = "python-onlinestore-migun"
version = "0.1.0"
description = ""
authors = [
    {name = "EvgeniySpider",email = "evgeniy.migun@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "django-admin-interface (>=0.32.0,<0.33.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db"


[tool.ruff]
target-version = "py312"

# Длина строки (совпадает для линтера и форматтера)
line-length = 88

# Файлы и директории, которые следует исключить
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "migrations",      # <-- ОБЯЗАТЕЛЬНО ДЛЯ DJANGO
    "*/migrations/*",  # <-- исключаем вложенные миграции во всех приложениях
]

[tool.ruff.lint]
# Включение наборов правил
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (неиспользуемые переменные, импорты и т.д.)
    "I",    # isort (сортировка импортов)
    "B",    # flake8-bugbear (типичные логические баги)
    "UP",   # pyupgrade (устаревший синтаксис)
]

# Игнорирование конкретных правил
ignore = [
    "E501", # Игнорировать длину строки (ее форматирует ruff format)
]

# Разрешить автоисправление (fix) для конкретных правил
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Настройки форматтера (Black-style)
quote-style = "double"
indent-style = "space"